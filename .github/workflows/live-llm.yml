name: Live LLM integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      LOCAL_DEV_MODE: "true"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Require configured secret
        run: test -n "$GROQ_API_KEY"
      - run: python -m pytest -m integration tests/test_nl_parser.py -ra -p no:cacheprovider
