[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# ─── CHANGE THIS when you pick a name ───
name = "scedly"
# ─────────────────────────────────────────
version = "0.1.0"
description = "Scedly — your AI scheduling agent, in the terminal."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.0.0",
]

[project.scripts]
# ─── CHANGE THIS to your chosen command name ───
scedly = "scedly.cli:main"
# ────────────────────────────────────────────────
