services:
  # Backend — FastAPI (Docker)
  - type: web
    name: scedly-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_PARSER
        value: llama-3.1-8b-instant
      - key: MODEL_CHAT
        value: llama-3.3-70b-versatile
      - key: MODEL_FALLBACK
        value: gemini-2.0-flash

  # Frontend — Next.js (Node)
  - type: web
    name: scedly-frontend
    runtime: node
    rootDir: ./frontend/scedly
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PORT
        value: "3000"
